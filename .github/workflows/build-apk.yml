name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias student-register -keyalg RSA -keysize 2048 -validity 10000 -storepass changeit -keypass changeit -dname "CN=Student Register, OU=App, O=App, L=City, S=State, C=IQ"

      - name: Write TWA config
        run: |
          cat > twa-manifest.json <<'JSON'
          {
            "packageId": "com.example.studentregister",
            "host": "abdalkhliq.github.io",
            "name": "سجل الطلاب",
            "launcherName": "سجل الطلاب",
            "display": "standalone",
            "themeColor": "#6b4a36",
            "navigationColor": "#6b4a36",
            "backgroundColor": "#f7f1e6",
            "enableNotifications": false,
            "startUrl": "/mnsor3245.html/",
            "iconUrl": "https://abdalkhliq.github.io/mnsor3245.html/icon-512.png",
            "maskableIconUrl": "https://abdalkhliq.github.io/mnsor3245.html/icon-512.png",
            "webManifestUrl": "https://abdalkhliq.github.io/mnsor3245.html/manifest.json",
            "appVersionCode": 1,
            "appVersion": "1.0.0",
            "signingKey": { "path": "./android.keystore", "alias": "student-register" },
            "fallbackType": "customtabs",
            "orientation": "default",
            "generatorApp": "bubblewrap-cli"
          }
          JSON

      - name: Build APK
        timeout-minutes: 12
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: changeit
          BUBBLEWRAP_KEY_PASSWORD: changeit
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          bubblewrap build --skipPwaValidation < /dev/null
          ls -la *.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: student-register-apk
          path: "*.apk"